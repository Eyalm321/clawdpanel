# nfpm config for building .deb and .rpm packages.
# Build with:
#   nfpm package -f build/linux/nfpm.yaml -p deb -t ./dist
#   nfpm package -f build/linux/nfpm.yaml -p rpm -t ./dist
#
# Assumes the Linux binary has already been produced at build/bin/clawdpanel
# by `wails build -platform linux/amd64`.

name: clawdpanel
arch: amd64
platform: linux
version: ${VERSION}
section: utils
priority: optional
maintainer: ClawdPanel <noreply@example.com>
description: |
  Lightweight always-on-top desktop bar that displays Claude Code usage
  across multiple accounts with a retro terminal aesthetic.
vendor: ClawdPanel
homepage: https://github.com/Eyalm321/clawdpanel
license: MIT

# Dependency names differ per distro family, so they live under
# overrides (nfpm applies the matching set per output format).
# The wails3 build links GTK4 + WebKitGTK 6.0 — not the GTK3 /
# webkit2gtk-4.x stack of the old wails v2 builds.
overrides:
  deb:
    depends:
      - libwebkitgtk-6.0-4
      - libgtk-4-1
      - wmctrl
      - x11-utils    # provides xprop
      - xdotool
      - python3
      - gstreamer1.0-plugins-base
      - gstreamer1.0-plugins-good
      - gstreamer1.0-plugins-bad
    recommends:
      - nodejs       # required for the statusline command to run
  rpm:
    depends:
      - webkitgtk6.0
      - gtk4
      - wmctrl
      # Rich/boolean dep: the package that ships /usr/bin/xprop was renamed.
      # Fedora 40+ / RHEL 10+ call it `xprop`; older EL shipped `xorg-x11-utils`
      # (which no longer exists on Fedora — the stale name made the whole dnf5
      # transaction unresolvable with "Id is out of bitmap range"). libsolv
      # treats a paren-prefixed Requires with no version flag as a rich dep, so
      # dnf installs whichever name exists on the target distro.
      - "(xprop or xorg-x11-utils)"
      - xdotool
      - python3
      - gstreamer1-plugins-base
      - gstreamer1-plugins-good
      - gstreamer1-plugins-bad-free
    recommends:
      - nodejs       # required for the statusline command to run
      # GNOME has no built-in tray; the AppIndicator extension restores it
      # (user still needs to enable it / re-login).
      - gnome-shell-extension-appindicator

contents:
  - src: ./bin/clawdpanel
    dst: /usr/bin/clawdpanel
    file_info:
      mode: 0755
  - src: ./build/linux/clawdpanel.desktop
    dst: /usr/share/applications/clawdpanel.desktop
  - src: ./build/linux/icon.png
    dst: /usr/share/icons/hicolor/256x256/apps/clawdpanel.png

scripts:
  postinstall: ./build/linux/scripts/postinstall.sh
  preremove: ./build/linux/scripts/preremove.sh
