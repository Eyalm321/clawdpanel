# nfpm config for building .deb and .rpm packages.
# Build with:
#   nfpm package -f build/linux/nfpm.yaml -p deb -t ./dist
#   nfpm package -f build/linux/nfpm.yaml -p rpm -t ./dist
#
# Assumes the release binary has already been produced at ./bin/clawdpanel
# (CI copies `target/release/clawdpanel` there after `cargo build --release`).

name: clawdpanel
arch: amd64
platform: linux
version: ${VERSION}
section: utils
priority: optional
maintainer: ClawdPanel <noreply@example.com>
description: |
  Lightweight always-on-top desktop bar that displays Claude Code usage
  across multiple accounts with a retro terminal aesthetic.
vendor: ClawdPanel
homepage: https://github.com/Eyalm321/clawdpanel
license: MIT

# Dependency names differ per distro family, so they live under
# overrides (nfpm applies the matching set per output format).
#
# Rust/Slint stack (rework S12): the binary is a native Slint + winit (X11)
# app, NOT a WebView. The GTK4 / WebKitGTK 6.0 deps are gone, and so are the
# wmctrl/xprop/xdotool subprocess tools — x11rb talks the X protocol directly
# now. Runtime deps are the Slint winit/femtovg stack: libxkbcommon (+ its X11
# variant), fontconfig, Mesa libGL, and the core Xlib libs winit dlopens
# (libX11/Xcursor/Xi/Xrandr). GStreamer stays for the media slice; python3 for
# the postinstall statusline hook.
overrides:
  deb:
    depends:
      - libxkbcommon0
      - libxkbcommon-x11-0
      - libfontconfig1
      - libgl1
      - libx11-6
      - libxcursor1
      - libxi6
      - libxrandr2
      - python3
      - gstreamer1.0-plugins-base
      - gstreamer1.0-plugins-good
      - gstreamer1.0-plugins-bad
    recommends:
      - nodejs       # required for the statusline command to run
  rpm:
    depends:
      - libxkbcommon
      - libxkbcommon-x11
      - fontconfig
      - mesa-libGL
      - libX11
      - libXcursor
      - libXi
      - libXrandr
      - python3
      - gstreamer1-plugins-base
      - gstreamer1-plugins-good
      - gstreamer1-plugins-bad-free
    recommends:
      - nodejs       # required for the statusline command to run
      # GNOME has no built-in tray; the AppIndicator extension restores it
      # (user still needs to enable it / re-login).
      - gnome-shell-extension-appindicator

contents:
  - src: ./bin/clawdpanel
    dst: /usr/bin/clawdpanel
    file_info:
      mode: 0755
  - src: ./build/linux/clawdpanel.desktop
    dst: /usr/share/applications/clawdpanel.desktop
  - src: ./build/linux/icon.png
    dst: /usr/share/icons/hicolor/256x256/apps/clawdpanel.png

scripts:
  postinstall: ./build/linux/scripts/postinstall.sh
  preremove: ./build/linux/scripts/preremove.sh
