[package]
name = "clawdpanel-ui"
version.workspace = true
edition.workspace = true

[dependencies]
clawdpanel-types.workspace = true
# default-features off + explicit renderers/backend matches the verified
# frameless-window config (see ~/dev/borderless); `unstable-winit-030` exposes
# slint::winit_030 so we can flip decorations/always-on-top from Rust.
slint = { version = "1", default-features = false, features = [
    "std", "backend-winit", "renderer-femtovg", "renderer-software",
    "compat-1-2", "unstable-winit-030",
] }

[build-dependencies]
slint-build = "1"
