[package]
name = "clawdpanel-app"
version.workspace = true
edition.workspace = true

[[bin]]
name = "clawdpanel"
path = "src/main.rs"

[dependencies]
clawdpanel-types.workspace = true
clawdpanel-ui = { path = "../ui" }
clawdpanel-claude-core = { path = "../claude-core" }
# Station-URL parsing (ParseStationItem, S6) + the radio playback engine
# (Controller/proxy/cache/gstreamer/station/RadioBridge wiring, S7).
clawdpanel-media = { path = "../media" }
# Linux X11 dock + struts + the cursor-driven reveal machine + single-instance.
clawdpanel-platform-shell = { path = "../platform-shell" }
# Needed for the event loop, the smoke-run Timer and the winit-030 accessor used
# to make the window frameless + always-on-top. Features mirror crates/ui.
slint = { version = "1", default-features = false, features = [
    "std", "backend-winit", "renderer-femtovg", "renderer-software",
    "compat-1-2", "unstable-winit-030",
] }
# Background poll loop: a tokio runtime on its own thread drives the async
# load_bar_data (~15s) + get_status (500ms) and pushes results onto the UI.
tokio = { version = "1", features = ["rt-multi-thread", "time", "macros"] }
