[package]
name = "clawdpanel-media"
version.workspace = true
edition.workspace = true

[dependencies]
clawdpanel-types.workspace = true
serde = { workspace = true }
serde_json = { workspace = true }
once_cell = "1"
regex = "1"
bytes = "1"
parking_lot = "0.12"
rand = "0.8"
async-trait = "0.1"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros", "net"] }
tokio-util = "0.7"
log = "0.4"

futures-util = "0.3"

# Local proxy + upstream/ranged HTTP (VOD byte-cache, DASH fetch, passthrough).
axum = { version = "0.7", default-features = false, features = ["http1", "tokio", "query"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }

# YouTube extraction (kkdai/youtube replacement). Highest fidelity risk; kept
# behind the StreamResolver trait so the spine stays green if extraction drifts.
# `search` gates the Playlist API (ExpandPlaylist port).
rusty_ytdl = { version = "0.7", default-features = false, features = ["rustls-tls", "search"] }

[target.'cfg(target_os = "linux")'.dependencies]
# Linux audio backend: 1:1 of the existing playbin preroll/buffer logic.
gstreamer = "0.23"

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros", "test-util"] }
# Real XML parse for the staticizer acceptance gate (mirrors Go's encoding/xml
# well-formedness check); already in the lockfile as a transitive dep.
roxmltree = "0.21"
