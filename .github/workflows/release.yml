name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows / macOS legs are TODO stubs until the per-OS platform-shell
          # implementations land (S10 #57 = Windows, S11 #58 = macOS). The
          # existing NSIS (build/windows/installer) and pkgbuild (build/darwin)
          # scripts are kept in-tree and will be rewired here when they land.
          - os: windows-latest
            name: Windows
            artifact: clawdpanel-windows-installer
          - os: macos-latest
            name: macOS
            artifact: clawdpanel-macos-pkg
          - os: ubuntu-latest
            name: Linux
            artifact: clawdpanel-linux

    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # ── TODO stubs (no build): Windows/macOS packaging pending #57 / #58 ──
      - name: Windows packaging (pending S10 #57)
        if: matrix.os == 'windows-latest'
        shell: bash
        run: |
          echo "::notice title=Windows leg stubbed::The Rust NSIS installer build"
          echo "is pending S10 (#57 — Windows platform-shell impl). The existing"
          echo "build/windows/installer/project.nsi + wails_tools.nsh are retained"
          echo "in-tree and will be rewired into this leg when #57 lands."
          exit 0

      - name: macOS packaging (pending S11 #58)
        if: matrix.os == 'macos-latest'
        shell: bash
        run: |
          echo "::notice title=macOS leg stubbed::The Rust .app/.pkg build is"
          echo "pending S11 (#58 — macOS platform-shell impl, incl. AX pushdown)."
          echo "The existing build/darwin scripts (pkgbuild) are retained in-tree"
          echo "and will be rewired into this leg when #58 lands."
          exit 0

      # ── Linux: the only fully-wired leg for S12-prep ──
      - name: Setup Rust toolchain
        if: matrix.os == 'ubuntu-latest'
        uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Install Linux build deps
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          # Slint + winit (X11) + femtovg build/runtime stack, GStreamer for the
          # media slice, and wget/file for appimagetool. No GTK/WebKit.
          sudo apt-get install -y \
            pkg-config wget file \
            libxkbcommon-dev libxkbcommon-x11-dev \
            libfontconfig1-dev libgl1-mesa-dev \
            libx11-dev libxcursor-dev libxi-dev libxrandr-dev libxcb1-dev \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            gstreamer1.0-plugins-base gstreamer1.0-plugins-good gstreamer1.0-plugins-bad

      - name: Resolve version
        id: version
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            echo "version=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
            echo "semver=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=dev-${{ github.run_number }}" >> "$GITHUB_OUTPUT"
            echo "semver=0.0.0-dev.${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build Linux release binary
        if: matrix.os == 'ubuntu-latest'
        env:
          # Compiled into the binary via option_env! (crates/app/src/updater.rs);
          # the analogue of the old Go ldflags `-X main.Version`.
          CLAWDPANEL_VERSION: ${{ steps.version.outputs.version }}
        run: |
          cargo build --release -p clawdpanel-app
          # nfpm.yaml + build-appimage.sh expect the binary at ./bin/clawdpanel.
          mkdir -p bin
          cp target/release/clawdpanel bin/clawdpanel

      - name: Install nfpm
        if: matrix.os == 'ubuntu-latest'
        run: |
          curl -sSfL https://github.com/goreleaser/nfpm/releases/download/v2.41.0/nfpm_2.41.0_Linux_x86_64.tar.gz \
            | sudo tar -xz -C /usr/local/bin nfpm

      - name: Build .deb and .rpm
        if: matrix.os == 'ubuntu-latest'
        env:
          VERSION: ${{ steps.version.outputs.semver }}
        run: |
          mkdir -p dist
          chmod +x build/linux/scripts/postinstall.sh build/linux/scripts/preremove.sh
          # nfpm doesn't expand env vars in the YAML — substitute first.
          sed "s/\${VERSION}/$VERSION/" build/linux/nfpm.yaml > nfpm.tmp.yaml
          nfpm package -f nfpm.tmp.yaml -p deb -t dist/
          nfpm package -f nfpm.tmp.yaml -p rpm -t dist/

      - name: Build AppImage
        if: matrix.os == 'ubuntu-latest'
        run: |
          wget -q https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool-x86_64.AppImage
          sudo mv appimagetool-x86_64.AppImage /usr/local/bin/appimagetool
          chmod +x build/linux/build-appimage.sh build/linux/AppRun
          # appimagetool inside Docker / CI needs the FUSE workaround:
          export APPIMAGE_EXTRACT_AND_RUN=1
          OUT_DIR=$PWD/dist ./build/linux/build-appimage.sh

      - name: Upload artifacts
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: dist/*

  release:
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Flatten artifact layout
        run: |
          mkdir -p dist
          find artifacts -type f -exec cp {} dist/ \;
          ls -la dist/

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
