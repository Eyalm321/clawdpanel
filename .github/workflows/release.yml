name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows / macOS legs are TODO stubs until the per-OS platform-shell
          # implementations land (S10 #57 = Windows, S11 #58 = macOS). The
          # existing NSIS (build/windows/installer) and pkgbuild (build/darwin)
          # scripts are kept in-tree and will be rewired here when they land.
          - os: windows-latest
            name: Windows
            artifact: clawdpanel-windows-installer
          - os: macos-latest
            name: macOS
            artifact: clawdpanel-macos-pkg
          - os: ubuntu-latest
            name: Linux
            artifact: clawdpanel-linux

    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # Setup Rust toolchain on all platforms
      - name: Setup Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Install macOS Rust targets
        if: matrix.os == 'macos-latest'
        run: |
          rustup target add x86_64-apple-darwin
          rustup target add aarch64-apple-darwin

      - name: Install Linux build deps
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          # Slint + winit (X11) + femtovg build/runtime stack, GStreamer for the
          # media slice, and wget/file for appimagetool. Also GTK3 and appindicator
          # dependencies for the tray icon.
          sudo apt-get install -y \
            pkg-config wget file \
            libxkbcommon-dev libxkbcommon-x11-dev \
            libfontconfig1-dev libgl1-mesa-dev \
            libx11-dev libxcursor-dev libxi-dev libxrandr-dev libxcb1-dev \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            gstreamer1.0-plugins-base gstreamer1.0-plugins-good gstreamer1.0-plugins-bad \
            libgtk-3-dev libayatana-appindicator3-dev

      - name: Resolve version
        id: version
        shell: bash
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            echo "version=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
            echo "semver=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=dev-${{ github.run_number }}" >> "$GITHUB_OUTPUT"
            echo "semver=0.0.0-dev.${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build Linux release binary
        if: matrix.os == 'ubuntu-latest'
        env:
          # Compiled into the binary via option_env! (crates/app/src/updater.rs);
          # the analogue of the old Go ldflags `-X main.Version`.
          CLAWDPANEL_VERSION: ${{ steps.version.outputs.version }}
        run: |
          cargo build --release -p clawdpanel-app
          # nfpm.yaml + build-appimage.sh expect the binary at ./bin/clawdpanel.
          mkdir -p bin
          cp target/release/clawdpanel bin/clawdpanel

      - name: Build macOS release binaries
        if: matrix.os == 'macos-latest'
        env:
          CLAWDPANEL_VERSION: ${{ steps.version.outputs.version }}
        run: |
          cargo build --release --target x86_64-apple-darwin -p clawdpanel-app
          cargo build --release --target aarch64-apple-darwin -p clawdpanel-app
          mkdir -p target/release
          lipo -create -output target/release/clawdpanel target/x86_64-apple-darwin/release/clawdpanel target/aarch64-apple-darwin/release/clawdpanel

      - name: Build Windows release binary
        if: matrix.os == 'windows-latest'
        env:
          CLAWDPANEL_VERSION: ${{ steps.version.outputs.version }}
        run: |
          cargo build --release -p clawdpanel-app

      - name: Install nfpm
        if: matrix.os == 'ubuntu-latest'
        run: |
          curl -sSfL https://github.com/goreleaser/nfpm/releases/download/v2.41.0/nfpm_2.41.0_Linux_x86_64.tar.gz \
            | sudo tar -xz -C /usr/local/bin nfpm

      - name: Build .deb and .rpm
        if: matrix.os == 'ubuntu-latest'
        env:
          VERSION: ${{ steps.version.outputs.semver }}
        run: |
          mkdir -p dist
          chmod +x build/linux/scripts/postinstall.sh build/linux/scripts/preremove.sh
          # nfpm doesn't expand env vars in the YAML — substitute first.
          sed "s/\${VERSION}/$VERSION/" build/linux/nfpm.yaml > nfpm.tmp.yaml
          nfpm package -f nfpm.tmp.yaml -p deb -t dist/
          nfpm package -f nfpm.tmp.yaml -p rpm -t dist/

      - name: Build AppImage
        if: matrix.os == 'ubuntu-latest'
        run: |
          wget -q https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool-x86_64.AppImage
          sudo mv appimagetool-x86_64.AppImage /usr/local/bin/appimagetool
          chmod +x build/linux/build-appimage.sh build/linux/AppRun
          # appimagetool inside Docker / CI needs the FUSE workaround:
          export APPIMAGE_EXTRACT_AND_RUN=1
          OUT_DIR=$PWD/dist ./build/linux/build-appimage.sh

      - name: macOS packaging
        if: matrix.os == 'macos-latest'
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.semver }}
        run: |
          mkdir -p bin/ClawdPanel.app/Contents/MacOS
          mkdir -p bin/ClawdPanel.app/Contents/Resources
          cp build/darwin/icons.icns bin/ClawdPanel.app/Contents/Resources/iconfile.icns
          if [ -f build/darwin/Assets.car ]; then
            cp build/darwin/Assets.car bin/ClawdPanel.app/Contents/Resources/
          fi
          cp target/release/clawdpanel bin/ClawdPanel.app/Contents/MacOS/ClawdPanel
          cp build/darwin/Info.plist bin/ClawdPanel.app/Contents/Info.plist
          # Replace version in Info.plist dynamically
          sed -i.bak "s/<string>2.0.0<\/string>/<string>$VERSION<\/string>/g" bin/ClawdPanel.app/Contents/Info.plist
          # Ad-hoc codesign the .app bundle (essential for modern macOS TCC accessibility grants to persist across restarts)
          codesign --force --deep --sign - bin/ClawdPanel.app
          mkdir -p dist
          pkgbuild --identifier com.eyalm321.clawdpanel \
                   --version "$VERSION" \
                   --component bin/ClawdPanel.app \
                   --install-location /Applications \
                   --scripts build/darwin/scripts \
                   dist/clawdpanel-macos.pkg

      - name: Windows packaging
        if: matrix.os == 'windows-latest'
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.semver }}
        run: |
          mkdir -p bin
          mkdir -p dist
          makensis \
            -DARG_WAILS_AMD64_BINARY=../../target/release/clawdpanel.exe \
            -DINFO_PROJECTNAME="clawdpanel" \
            -DINFO_COMPANYNAME="ClawdPanel" \
            -DINFO_PRODUCTNAME="Clawd Panel" \
            -DINFO_PRODUCTVERSION="$VERSION" \
            -DINFO_COPYRIGHT="2026" \
            build/windows/installer/project.nsi
          cp bin/*-installer.exe dist/

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: dist/*

  release:
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Flatten artifact layout
        run: |
          mkdir -p dist
          find artifacts -type f -exec cp {} dist/ \;
          ls -la dist/

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
