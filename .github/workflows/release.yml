name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: Windows
            artifact: clawdpanel-windows-installer
            allow_failure: false
          - os: macos-latest
            name: macOS
            artifact: clawdpanel-macos-pkg
            allow_failure: false
          - os: ubuntu-latest
            name: Linux
            artifact: clawdpanel-linux
            allow_failure: false

    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.allow_failure }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          # Read the version straight from go.mod (currently 1.26) so the
          # toolchain can't drift out of sync. setup-go@v6 defaults
          # GOTOOLCHAIN=local, so an installed Go older than go.mod's
          # requirement now fails instead of silently auto-downloading.
          go-version-file: go.mod

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          # vite 8 (bumped for the security fix) requires Node ^20.19 || >=22.12;
          # Node 18 lacks the global CustomEvent and fails the frontend build.
          node-version: '22'

      - name: Install Linux build deps
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libgtk-4-dev libwebkit2gtk-4.1-dev libwebkitgtk-6.0-dev libayatana-appindicator3-dev pkg-config wget file libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev gstreamer1.0-plugins-base gstreamer1.0-plugins-good gstreamer1.0-plugins-bad

      - name: Install Wails CLI
        shell: bash
        run: |
          go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-alpha.96

      - name: Resolve version
        id: version
        shell: bash
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            echo "version=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
            echo "semver=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=dev-${{ github.run_number }}" >> "$GITHUB_OUTPUT"
            echo "semver=0.0.0-dev.${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          fi

      # ── Windows ──
      - name: Install NSIS
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          # Chocolatey first (with retry), then a direct SourceForge zip as
          # fallback: the community feed 504'd for over an hour during the
          # v2.2.2 release. The install failure must also FAIL THE STEP -
          # without an explicit makensis check the trailing PATH append
          # swallowed the exit code and the build died two steps later with
          # a bare "makensis not found".
          $nsisDir = "C:\Program Files (x86)\NSIS"
          foreach ($attempt in 1..2) {
            choco install nsis -y --no-progress
            if ($LASTEXITCODE -eq 0 -and (Test-Path "$nsisDir\makensis.exe")) { break }
            Write-Host "choco install nsis failed (attempt $attempt)"
            Start-Sleep -Seconds 15
          }
          if (-not (Test-Path "$nsisDir\makensis.exe")) {
            Write-Host "Chocolatey unavailable; falling back to SourceForge zip"
            $zip = Join-Path $env:TEMP "nsis.zip"
            Invoke-WebRequest -Uri "https://downloads.sourceforge.net/project/nsis/NSIS%203/3.11/nsis-3.11.zip" -OutFile $zip -UserAgent "Wget/1.21" -MaximumRedirection 10
            Expand-Archive $zip -DestinationPath "C:\nsis-fallback" -Force
            $nsisDir = "C:\nsis-fallback\nsis-3.11"
          }
          if (-not (Test-Path "$nsisDir\makensis.exe")) { throw "makensis.exe not found after install" }
          # NSIS isn't added to PATH for the next step's shell either way.
          $nsisDir | Out-File -Append -Encoding utf8 -FilePath $env:GITHUB_PATH

      - name: Build Windows installer
        if: matrix.os == 'windows-latest'
        working-directory: ./windows
        run: wails3 task package WAILS3=wails3 VERSION=${{ steps.version.outputs.version }}

      - name: Stage Windows artifact
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          Write-Host "Contents of bin:"
          Get-ChildItem bin
          New-Item -ItemType Directory -Force dist | Out-Null
          # Match whatever Wails NSIS produced (filename includes outputfilename + arch).
          $installer = Get-ChildItem bin -Filter '*installer*.exe' | Select-Object -First 1
          if (-not $installer) { throw "No installer .exe found in bin" }
          Copy-Item $installer.FullName "dist\ClawdPanel-${{ steps.version.outputs.semver }}-windows-amd64-setup.exe"

      # ── macOS ──
      - name: Build macOS app bundle
        if: matrix.os == 'macos-latest'
        working-directory: ./darwin
        run: wails3 task package:universal WAILS3=wails3 VERSION=${{ steps.version.outputs.version }}

      - name: Build macOS .pkg
        if: matrix.os == 'macos-latest'
        run: |
          mkdir -p pkgroot/Applications
          cp -R bin/ClawdPanel.app pkgroot/Applications/
          chmod +x build/darwin/scripts/postinstall build/darwin/scripts/preuninstall
          mkdir -p dist
          pkgbuild \
            --root pkgroot \
            --install-location / \
            --scripts build/darwin/scripts \
            --identifier com.clawdpanel.pkg \
            --version "${{ steps.version.outputs.semver }}" \
            "dist/ClawdPanel-${{ steps.version.outputs.semver }}-macos-universal.pkg"


      - name: Build Linux binary
        if: matrix.os == 'ubuntu-latest'
        working-directory: ./linux
        run: wails3 task build WAILS3=wails3 EXTRA_TAGS=webkit2_41 VERSION=${{ steps.version.outputs.version }}

      - name: Normalise Linux binary name to lowercase
        if: matrix.os == 'ubuntu-latest'
        # Wails honours outputfilename ("ClawdPanel") on Linux too, but the
        # nfpm.yaml and AppImage script expect lowercase per Linux convention.
        run: cp bin/ClawdPanel bin/clawdpanel

      - name: Install nfpm
        if: matrix.os == 'ubuntu-latest'
        run: |
          curl -sSfL https://github.com/goreleaser/nfpm/releases/download/v2.41.0/nfpm_2.41.0_Linux_x86_64.tar.gz \
            | sudo tar -xz -C /usr/local/bin nfpm

      - name: Build .deb and .rpm
        if: matrix.os == 'ubuntu-latest'
        env:
          VERSION: ${{ steps.version.outputs.semver }}
        run: |
          mkdir -p dist
          chmod +x build/linux/scripts/postinstall.sh build/linux/scripts/preremove.sh
          # nfpm doesn't expand env vars in the YAML — substitute first.
          sed "s/\${VERSION}/$VERSION/" build/linux/nfpm.yaml > nfpm.tmp.yaml
          nfpm package -f nfpm.tmp.yaml -p deb -t dist/
          nfpm package -f nfpm.tmp.yaml -p rpm -t dist/

      - name: Build AppImage
        if: matrix.os == 'ubuntu-latest'
        run: |
          wget -q https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool-x86_64.AppImage
          sudo mv appimagetool-x86_64.AppImage /usr/local/bin/appimagetool
          chmod +x build/linux/build-appimage.sh build/linux/AppRun
          # appimagetool inside Docker / CI needs FUSE workaround:
          export APPIMAGE_EXTRACT_AND_RUN=1
          OUT_DIR=$PWD/dist ./build/linux/build-appimage.sh

      # ── Upload ──
      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: dist/*

  release:
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Flatten artifact layout
        run: |
          mkdir -p dist
          find artifacts -type f -exec cp {} dist/ \;
          ls -la dist/

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
