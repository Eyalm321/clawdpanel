name: Cross-compile check

# release.yml only builds Windows/macOS/Linux on a v* tag, so code that
# references a Linux-only platform symbol from cross-platform files
# (app.go, main.go, internal/reveal) compiles on the author's Linux box,
# merges, and only fails at release time (this broke v2.2.4 — see #45).
#
# This fast job runs on every PR to master and cross-compiles the platform
# layer for the non-Linux targets, so that class of break is caught before
# merge instead of at release. It needs no cgo cross-toolchain: the platform
# package is built with CGO_ENABLED=0, which is enough to catch missing /
# duplicate platform symbols (would have caught #44).

on:
  pull_request:
    branches:
      - master
  workflow_dispatch:

# A new push to the same PR cancels the in-flight check.
concurrency:
  group: cross-compile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cross-compile:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        goos: [windows, darwin]
    env:
      # No cgo cross-toolchain on the runner; the platform layer is written
      # so the non-cgo files (stubs + shared code) build without it.
      CGO_ENABLED: 0
      GOOS: ${{ matrix.goos }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          # Read the version straight from go.mod, same as release.yml, so the
          # toolchain can't drift out of sync.
          go-version-file: go.mod

      - name: Build platform layer for ${{ matrix.goos }}
        run: go build ./internal/platform/...

      - name: Vet platform layer for ${{ matrix.goos }}
        run: go vet ./internal/platform/...

      - name: Vet pure-Go internal packages for ${{ matrix.goos }}
        # Only packages that are pure Go (or carry a CGO_ENABLED=0 fallback)
        # cross-vet cleanly. internal/reveal and internal/tray are excluded on
        # purpose: their darwin/windows symbols live in cgo-only files, so with
        # CGO disabled they report false "undefined" errors rather than real
        # breaks. Cross-compiling those needs the full release toolchain.
        run: >
          go vet
          ./internal/audio/...
          ./internal/claude/...
          ./internal/config/...
          ./internal/radio/...
          ./internal/station/...
