version: '3'

tasks:
  build:
    summary: Builds the Rust application in release mode
    cmds:
      - cargo build --release

  run:
    summary: Runs the application in release mode
    cmds:
      - cargo run --release -p clawdpanel-app

  dev:
    summary: Runs the application in development mode
    cmds:
      - cargo run -p clawdpanel-app

  check:
    summary: Runs cargo check on the workspace
    cmds:
      - cargo check --workspace

  test:
    summary: Runs cargo test on the workspace
    cmds:
      - cargo test --workspace

  clean:
    summary: Cleans build artifacts
    cmds:
      - cargo clean
      - rm -rf bin dist
